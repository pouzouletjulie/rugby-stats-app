<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- White background -->
  <rect width="100" height="100" rx="18" fill="white"/>
  <!-- Ball body -->
  <path d="M14,50 C14,28 30,16 50,16 C70,16 86,28 86,50 C86,72 70,84 50,84 C30,84 14,72 14,50 Z" fill="#7B4020"/>
  <!-- Top highlight arc -->
  <path d="M24,35 C33,24 67,24 76,35" fill="none" stroke="#A0522D" stroke-width="3" stroke-linecap="round"/>
  <!-- Horizontal seam band -->
  <path d="M14,50 C30,43 70,43 86,50 C70,57 30,57 14,50 Z" fill="#6B3318"/>
  <!-- Central lace column -->
  <line x1="50" y1="33" x2="50" y2="67" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Left lace column -->
  <line x1="43" y1="37" x2="43" y2="63" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Right lace column -->
  <line x1="57" y1="37" x2="57" y2="63" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Lace cross bars -->
  <line x1="43" y1="41" x2="57" y2="41" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="43" y1="50" x2="57" y2="50" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="43" y1="59" x2="57" y2="59" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
</svg>
